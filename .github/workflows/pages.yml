# Publishes a demo of the site to GitHub Pages on every push to main:
# https://jmalture.github.io/amaze_genius/ (noindex; the contact form has no server there).
# Builds the static pages under the /amaze_genius/ sub-path and pushes them to the gh-pages branch.
name: Demo on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://jmalture.github.io
      SITE_BASE: /amaze_genius/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/rebase.mjs
      - run: touch dist/client/.nojekyll
      - name: Push to gh-pages
        run: |
          cd dist/client
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
